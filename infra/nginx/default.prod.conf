# Production-ready nginx config for the platform
# - proxies /api/ to api-gateway
# - exposes health and readiness endpoints
# - provides a basic rate-limit and security header scaffold

# Basic rate limiting by IP (burst + steady rate)
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Simple status endpoint for environment visibility
    location = /status {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'edge ready';
    }

    # API proxy
    location /api/ {
        limit_req zone=one burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_pass http://api-gateway:8080/;

        # CORS preflight handling (simple)</n+        if ($request_method = OPTIONS) {
            add_header "Access-Control-Allow-Origin" "$http_origin";
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS";
            add_header "Access-Control-Allow-Headers" "Authorization,Content-Type,X-API-Key";
            add_header "Access-Control-Allow-Credentials" "true";
            return 204;
        }
    }

    # Default - simple static response to indicate the edge is alive
    location / {
        add_header Content-Type text/plain;
        return 200 'multi-agent platform edge ready';
    }
}
