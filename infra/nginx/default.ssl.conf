server {
    listen 443 ssl http2;
    server_name your-domain.example; # replace with your domain

    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem; # placeholder
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;   # placeholder
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;
    gzip on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://api-gateway:8080/;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 'multi-agent platform edge ready (https)';
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
