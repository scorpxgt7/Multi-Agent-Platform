version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  skill-service:
    build:
      context: ..
      dockerfile: services/skill-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EVENT_CHANNEL: ${EVENT_CHANNEL}
      SKILL_SERVICE_PORT: ${SKILL_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-service:
    build:
      context: ..
      dockerfile: services/agent-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EVENT_CHANNEL: ${EVENT_CHANNEL}
      AGENT_SERVICE_PORT: ${AGENT_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  policy-service:
    build:
      context: ..
      dockerfile: services/policy-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EVENT_CHANNEL: ${EVENT_CHANNEL}
      POLICY_SERVICE_PORT: ${POLICY_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  memory-service:
    build:
      context: ..
      dockerfile: services/memory-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      VECTOR_BACKEND: ${VECTOR_BACKEND}
      EVENT_CHANNEL: ${EVENT_CHANNEL}
      MEMORY_SERVICE_PORT: ${MEMORY_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator-service:
    build:
      context: ..
      dockerfile: services/orchestrator-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EVENT_CHANNEL: ${EVENT_CHANNEL}
      ORCHESTRATOR_SERVICE_PORT: ${ORCHESTRATOR_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skill-service:
        condition: service_started
      agent-service:
        condition: service_started
      policy-service:
        condition: service_started
      memory-service:
        condition: service_started

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      SKILL_SERVICE_URL: ${SKILL_SERVICE_URL}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL}
      POLICY_SERVICE_URL: ${POLICY_SERVICE_URL}
      ORCHESTRATOR_SERVICE_URL: ${ORCHESTRATOR_SERVICE_URL}
    depends_on:
      skill-service:
        condition: service_started
      agent-service:
        condition: service_started
      policy-service:
        condition: service_started
      orchestrator-service:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  pgdata:
