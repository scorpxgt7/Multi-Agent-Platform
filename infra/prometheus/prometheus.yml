global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'orchestrator'
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestrator-service:8105']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187'] # expects postgres exporter if added

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121'] # expects redis exporter if added

  - job_name: 'workflow'
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestrator-service:8105']

  - job_name: 'api_gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'providers'
    metrics_path: /metrics
    static_configs:
      - targets: ['skill-service:8101', 'agent-service:8102']
