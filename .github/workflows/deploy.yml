name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm ci
          VITE_DEPLOY_ENV=production npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail
            cd '${{ secrets.DEPLOY_PATH }}' || true
            # Run the VPS deploy helper present in the repository (it will clone if needed)
            DEPLOY_ENV=production bash -lc 'bash -s' < ./deploy/deploy_vps.sh || true
